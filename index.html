<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hisab Book</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column. Month header, three tabs (Dashboard, Expenses, Settings),
   a floating Add button that opens a bottom sheet. Dashboard = salary ledger card with the 80% meter,
   category rows with 95% ticks, then a month pace chart. */
:root {
  --bg: #F2F2F7;
  --surface: #FFFFFF;
  --ink: #15202E;
  --muted: #5A6778;
  --line: #DCE2EB;
  --track: #E6EBF2;
  --accent: #0A6CFF;
  --accent-soft: #E3EEFF;
  --dock: #F8F8FB; --dock-pill: #FFFFFF; --hero-a: #2B84FF; --hero-b: #0B4FD1;
  --on-accent: #FFFFFF;
  --good: #14804F;
  --good-bg: #DFF3E8;
  --bad: #C73030;
  --bad-bg: #FBE6E6;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141C; --surface: #161E29; --ink: #E7ECF3; --muted: #97A4B6; --line: #263140;
    --track: #223041; --accent: #6AA8FF; --accent-soft: #172B4D; --dock: #1B2431; --dock-pill: #2B3749; --hero-a: #2F6FE0; --hero-b: #1A3A9C; --on-accent: #0E141C;
    --good: #4FCB8F; --good-bg: #14372A; --bad: #FF8080; --bad-bg: #3B1D22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141C; --surface: #161E29; --ink: #E7ECF3; --muted: #97A4B6; --line: #263140;
  --track: #223041; --accent: #6AA8FF; --accent-soft: #172B4D; --dock: #1B2431; --dock-pill: #2B3749; --hero-a: #2F6FE0; --hero-b: #1A3A9C; --on-accent: #0E141C;
  --good: #4FCB8F; --good-bg: #14372A; --bad: #FF8080; --bad-bg: #3B1D22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app {
  flex: 1 1 auto; min-width: 0; max-width: 760px; margin: 0 auto; padding-block: 20px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { min-width: 0; }
.brand h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.months { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.months button { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 9px; font-size: 18px; }
.months button:hover:not(:disabled) { background: var(--accent-soft); }
.months button:disabled { opacity: .35; cursor: default; }
.months strong { min-width: 138px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
main { margin-top: 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.burger { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; }
.shell { display: flex; min-height: 100vh; }
.side {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 35; width: min(280px, 84vw);
  display: flex; flex-direction: column; gap: 18px; background: var(--surface); border-right: 1px solid var(--line);
  padding: calc(20px + env(safe-area-inset-top, 0px)) 14px calc(20px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  transform: translateX(-102%);
}
.side.open { transform: none; box-shadow: 0 0 40px rgba(8, 12, 20, .35); }
.nav-scrim { position: fixed; inset: 0; z-index: 34; background: rgba(8, 12, 20, .55); }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.side-brand .logo { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-weight: 700; }
.side-brand strong { display: block; font-family: var(--font-display); font-size: 17px; line-height: 1.2; }
.side-brand small { color: var(--muted); font-size: 12px; }
.side-nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 11px 12px; font-weight: 500; color: var(--muted); }
.nav-item:hover { background: var(--track); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item svg, .burger svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.side-foot { margin-top: auto; padding: 0 6px; display: flex; flex-direction: column; gap: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--track); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 9px 6px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(10, 20, 40, .15); }
@media (prefers-reduced-motion: no-preference) {
  .side { transition: transform .22s ease; }
}
@media (min-width: 900px) {
  .side { position: sticky; align-self: flex-start; height: 100vh; width: 244px; flex: none; bottom: auto; z-index: auto; transform: none; box-shadow: none; }
  .burger { display: none; }
  .nav-scrim { display: none !important; }
}
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; }
.card-head h2 { font-size: 17px; font-weight: 600; }
.card-head span { color: var(--muted); font-size: 13px; }

/* hero */
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hero-num { font-family: var(--font-display); font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.1; margin: 4px 0 2px; }
.hero-num.neg { color: var(--bad); }
.hero-sub { color: var(--muted); font-size: 13px; }
.ledger { margin: 16px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.ledger li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.ledger li:last-child { border-bottom: 0; }
.ledger li.sum { font-weight: 600; }
.ledger .l { color: var(--muted); }
.ledger li.sum .l { color: var(--ink); }
.meter-wrap { margin-top: 16px; }
.meter-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; margin-bottom: 8px; font-size: 13px; }
.meter { position: relative; height: 10px; border-radius: 99px; background: var(--track); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--accent); }
.meter.good i { background: var(--good); }
.meter.bad i { background: var(--bad); }
.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
.tick-label { position: relative; height: 18px; font-size: 11px; color: var(--muted); }
.tick-label span { position: absolute; top: 5px; transform: translateX(-50%); white-space: nowrap; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--track); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.fixed { background: var(--accent-soft); color: var(--accent); }

/* category rows */
.rows { display: flex; flex-direction: column; }
.crow { padding: 12px 0; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; padding-top: 0; }
.crow:last-child { padding-bottom: 0; }
.crow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.crow-top .name { font-weight: 600; }
.crow-top .amt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.crow-top .amt small { color: var(--muted); font-weight: 400; }
.bar { position: relative; height: 8px; border-radius: 99px; background: var(--track); margin: 9px 0; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--accent); }
.bar.good i { background: var(--good); }
.bar.bad i { background: var(--bad); }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); opacity: .55; border-radius: 2px; }
.crow-bot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.subs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.subs b { color: var(--ink); font-weight: 500; }

/* chart */
#chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 0; border-top: 3px solid var(--accent); display: inline-block; }
.legend i.d1 { border-top: 2px dashed var(--muted); }
.legend i.d2 { border-top: 2px dashed var(--bad); }

/* expenses list */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.filters select { width: auto; max-width: 100%; }
.day { margin-top: 14px; }
.day h3 { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 11px 0; }
.item:hover .t { text-decoration: underline; }
.item .t { font-weight: 500; }
.item .n { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.item .a { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.empty { padding: 22px 6px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 17px; margin-bottom: 4px; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
.field label, .lbl { font-size: 13px; font-weight: 600; }
input[type="number"], input[type="text"], input[type="date"], select {
  width: 100%; min-width: 0; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; }
.set-sec { margin: 6px 0 10px; font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.err { color: var(--bad); font-size: 13px; margin: 0 0 10px; }
.primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 11px; padding: 11px 18px; font-weight: 600; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); border-radius: 11px; padding: 11px 16px; font-weight: 600; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; }

/* sheet and fab */
.fab {
  position: fixed; z-index: 20; border: 0; border-radius: 99px; padding: 14px 20px; font-weight: 600;
  background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px rgba(20, 30, 60, .28);
  right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
}
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(8, 12, 20, .55); }
.sheet {
  position: fixed; z-index: 31; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 520px); max-height: 92%; overflow: auto;
  background: var(--surface); border-radius: 18px 18px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-head h2 { font-size: 19px; }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.sheet-actions .primary { flex: 1 1 160px; }
#toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px);
  bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px;
}
.status { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .bar i, .meter i { transition: width .35s ease; }
}
@media (max-width: 420px) {
  .hero-num { font-size: 33px; }
  .months strong { min-width: 118px; }
}

/* ---- dock (Apple-style floating bar) ---- */
.app { padding-bottom: 140px; }
.dock {
  position: fixed; z-index: 25; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 20px), 480px);
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 26px;
  background: var(--dock); border: 1px solid var(--line);
  box-shadow: 0 12px 32px rgba(20, 30, 60, .16), 0 2px 6px rgba(20, 30, 60, .08);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.dock-pill {
  position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 5); border-radius: 20px;
  background: var(--dock-pill); box-shadow: 0 2px 8px rgba(20, 30, 60, .16);
  transform: translateX(calc(var(--i, 0) * 100%));
}
.dock-item {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 2px 7px; border: 0; background: transparent; color: var(--muted);
  font-size: 10.5px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; border-radius: 20px;
}
.dock-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dock-item[aria-current="page"] { color: var(--accent); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .dock-pill { transition: transform .4s cubic-bezier(.34, 1.35, .5, 1); }
  .dock-item svg { transition: transform .25s ease; }
  .dock-item[aria-current="page"] svg { transform: translateY(-1px) scale(1.1); }
}
.fab { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
#toast { bottom: calc(156px + env(safe-area-inset-bottom, 0px)); }

/* ---- current salary hero ---- */
.hero {
  position: relative; overflow: hidden; border-radius: 22px; padding: 20px; color: #fff;
  background: linear-gradient(150deg, var(--hero-a), var(--hero-b));
  box-shadow: 0 12px 30px rgba(20, 80, 220, .28);
}
.hero::after { content: ""; position: absolute; right: -70px; top: -70px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
.hero::before { content: ""; position: absolute; left: -50px; bottom: -90px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255, 255, 255, .07); }
.hero > * { position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero .eyebrow { color: rgba(255, 255, 255, .82); }
.hero .hero-num { font-size: 42px; margin: 8px 0 2px; color: #fff; }
.hero .hero-sub { color: rgba(255, 255, 255, .8); }
.hero-edit { border: 1px solid rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .16); color: #fff; border-radius: 99px; padding: 5px 14px; font-size: 13px; font-weight: 600; }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; background: rgba(255, 255, 255, .15); border-radius: 16px; padding: 12px; }
.hero-stats span { display: block; font-size: 11px; color: rgba(255, 255, 255, .78); }
.hero-stats b { display: block; font-size: 13.5px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.hero-left { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 16px; }
.hero-left span { color: rgba(255, 255, 255, .85); font-size: 13px; }
.hero-left b { font-family: var(--font-display); font-size: 22px; }
.hero-left b.neg { color: #FFD0D0; }
.hero .meter-wrap { margin-top: 12px; }
.hero .meter { background: rgba(255, 255, 255, .25); }
.hero .meter.good i, .hero .meter.none i, .hero .meter i { background: #fff; }
.hero .meter.bad i { background: #FFB0B0; }
.hero .meter .tick { background: #fff; }
.hero .tick-label { color: rgba(255, 255, 255, .8); }
.hero .pill { background: rgba(255, 255, 255, .2); color: #fff; }
.hero .pill.bad { background: rgba(255, 120, 120, .35); }

/* ---- months list ---- */
.mrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 14px 8px; border-radius: 0; }
.mrow:first-of-type { border-top: 0; }
.mrow .mn { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mrow .ms { color: var(--muted); font-size: 13px; }
.mrow[aria-current="true"] { background: var(--accent-soft); color: var(--accent); border-radius: 12px; border-top-color: transparent; }
.mrow[aria-current="true"] + .mrow { border-top-color: transparent; }

/* ===== glass theme ===== */
:root {
  --bg: #E8DDCB; --surface: rgba(255,255,255,.42); --ink: #26221B; --muted: #6E6558; --line: rgba(70,52,25,.14);
  --track: rgba(70,52,25,.13); --accent: #E9B824; --accent-soft: rgba(245,200,75,.32); --on-accent: #1B1812;
  --dock: rgba(255,255,255,.42); --dock-pill: rgba(255,255,255,.78); --hero-a: rgba(38,34,27,.80); --hero-b: rgba(82,68,44,.62);
  --good: #2C7A4D; --good-bg: rgba(44,122,77,.16); --bad: #C0392B; --bad-bg: rgba(192,57,43,.15);
  --pill-bg: #1C1A16; --pill-ink: #FFFFFF; --glass-bd: rgba(255,255,255,.62); --glass-sh: 0 10px 34px rgba(90,65,30,.14);
  --scene:
    radial-gradient(60% 45% at 8% 12%, rgba(118,142,80,.62) 0, transparent 70%),
    radial-gradient(55% 40% at 92% 8%, rgba(255,247,230,.98) 0, transparent 72%),
    radial-gradient(60% 45% at 85% 62%, rgba(178,128,82,.55) 0, transparent 70%),
    radial-gradient(70% 50% at 12% 90%, rgba(222,198,156,.9) 0, transparent 72%),
    radial-gradient(40% 30% at 50% 45%, rgba(246,236,218,.8) 0, transparent 70%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090807; --surface: rgba(255,255,255,.07); --ink: #F2EDE3; --muted: #A99F8F; --line: rgba(255,255,255,.12);
    --track: rgba(255,255,255,.13); --accent: #F5C84B; --accent-soft: rgba(245,200,75,.2); --on-accent: #1B1812;
    --dock: rgba(255,255,255,.08); --dock-pill: rgba(255,255,255,.17); --hero-a: rgba(255,255,255,.1); --hero-b: rgba(255,255,255,.04);
    --good: #66D6A0; --good-bg: rgba(102,214,160,.16); --bad: #FF8F82; --bad-bg: rgba(255,143,130,.16);

        html += '<div class="day"><h3>' + esc(label) + '</h3>';
        g.items.forEach(function (e) {
          var title = catName(e.cat) + (e.sub ? ' · ' + e.sub : '');
          html += '<button type="button" class="item" data-act="edit" data-id="' + esc(e.id) + '"><span><span class="t">' + esc(title) + '</span>' +
            (e.note ? '<span class="n">' + esc(e.note) + '</span>' : '') + '</span><span class="a num">' + money(e.amount) + '</span></button>';
        });
        html += '</div>';
      });
    }
    return html + '</div>';
  }

  function renderSettings() {
    var st = settingsFor(curMonth);
    var html = '<div class="card"><div class="card-head"><h2>' + esc(monthLabel(curMonth)) + ' setup</h2></div>';
    if (!st.own && st.from) html += '<p class="hint">These values are copied from ' + esc(monthLabel(st.from)) + '. Save to set this month\'s own values.</p>';
    else if (!st.own) html += '<p class="hint">Enter this month\'s salary, DPS and budgets, then save. New months start from the latest values you saved.</p>';
    else html += '<p class="hint">Changes apply to this month. Later months copy these until you change them.</p>';
    html += '<div class="grid2">' +
      '<div class="field"><label for="s-salary">Salary (Tk)</label><input id="s-salary" type="number" inputmode="decimal" min="0" step="any" value="' + (st.salary || '') + '" placeholder="0"></div>' +
      '<div class="field"><label for="s-dps">DPS per month (Tk)</label><input id="s-dps" type="number" inputmode="decimal" min="0" step="any" value="' + (st.dps || '') + '" placeholder="0"></div></div>';
    html += '<div class="set-sec">Budgets</div><div class="grid2">';
    CATS.forEach(function (c) {
      var v = Number(st.budgets[c.id]) || '';
      html += '<div class="field"><label for="s-b-' + c.id + '">' + esc(c.name) + '</label><input id="s-b-' + c.id + '" type="number" inputmode="decimal" min="0" step="any" value="' + v + '" placeholder="0"></div>';
    });
    html += '</div><div class="set-sec">Alert levels</div><div class="grid2">' +
      '<div class="field"><label for="s-spct">Salary alert at (%)</label><input id="s-spct" type="number" inputmode="numeric" min="1" max="100" step="1" value="' + st.salaryPct + '"></div>' +
      '<div class="field"><label for="s-bpct">Budget alert at (%)</label><input id="s-bpct" type="number" inputmode="numeric" min="1" max="100" step="1" value="' + st.budgetPct + '"></div></div>' +
      '<p class="hint">Salary turns red when DPS plus spending reaches the salary level. Each category turns red when its spending reaches the budget level. Otherwise it stays green.</p>' +
      '<p class="err" id="s-err" role="alert" hidden></p>' +
      '<button type="button" class="primary" data-act="save-settings">Save settings</button></div>';
    html += '<div class="card"><div class="card-head"><h2>Theme</h2></div><div class="seg" role="group" aria-label="Theme">' +
      '<button type="button" data-act="theme" data-theme-set="light" aria-pressed="false">Light</button>' +
      '<button type="button" data-act="theme" data-theme-set="dark" aria-pressed="false">Dark</button></div></div>';
    html += '<div class="card"><div class="card-head"><h2>Backup and restore</h2></div>' +
      '<p class="hint">All months, past and future, live together in your saved data. Keep a copy anytime, or bring old records in from a backup.</p>' +
      '<div class="sheet-actions" style="flex-wrap:wrap"><button type="button" class="primary" data-act="export-json">Backup (JSON)</button>' +
      '<button type="button" class="ghost" data-act="export-csv">Expenses (CSV)</button></div>' +
      '<div class="field" style="margin-top:14px"><label for="imp-file">Restore from a backup file</label><input id="imp-file" type="file" accept=".json,application/json"></div>' +
      '<p class="hint" id="bk-msg" role="status"></p></div>';
    html += '<div class="card"><div class="card-head"><h2>Language</h2></div><div class="seg" role="group"><button type="button" data-act="lang" data-l="en" aria-pressed="' + (LANG === 'en') + '">English</button><button type="button" data-act="lang" data-l="bn" aria-pressed="' + (LANG === 'bn') + '">বাংলা</button></div></div>';
    var rl = S.rec.map(function (r) { return '<div class="crow"><div class="crow-top"><span class="name">' + esc(catName(r.cat) + (r.sub ? ' · ' + r.sub : '')) + (r.note ? ' · ' + esc(r.note) : '') + '</span><span class="amt num">' + money(r.amount) + '</span></div><div class="crow-bot"><span>Every month on day ' + r.day + '</span><button type="button" class="ghost" data-act="rec-del" data-id="' + esc(r.id) + '">Remove</button></div></div>'; }).join('');
    var inp = 'style="width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line,#DCE2EB);border-radius:10px;background:transparent;color:inherit;font-size:15px;margin-bottom:8px"';
    html += '<div class="card"><div class="card-head"><h2>Recurring expenses</h2></div><div class="rows">' + rl + '</div><p class="hint">Added automatically every month, like rent or wifi. Edit or delete a single month from the expense list.</p>' +
      '<select id="r-cat" ' + inp + '>' + CATS.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select>' +
      '<select id="r-sub" ' + inp + '>' + CATS[0].subs.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
      '<input id="r-amt" type="number" inputmode="decimal" min="0" placeholder="Amount (Tk)" ' + inp + '><input id="r-day" type="number" inputmode="numeric" min="1" max="31" placeholder="Day of month (1-31)" ' + inp + '><input id="r-note" type="text" placeholder="Note (optional)" ' + inp + '>' +
      '<button type="button" class="primary" data-act="rec-add">Add recurring</button><p id="r-err" class="hint" style="color:var(--bad,#C73030)"></p></div>';
    html += '<div class="card"><div class="card-head"><h2>Google Drive</h2></div>' +
      '<p class="hint">' + esc(D.msg) + '</p>' +
      '<div class="sheet-actions" style="flex-wrap:wrap">' +
      (D.on ? '<button type="button" class="primary" data-act="drive-sync">Sync now</button><button type="button" class="ghost" data-act="signout">Sign out</button>'
            : '<button type="button" class="primary" data-act="drive-on">Sign in with Google</button>') +
      '</div></div>';
    $('#v-settings').innerHTML = html;
    syncTheme();
  }

  function render() {
    renderHead(); renderStatus(); setTimeout(applyLang, 0);
    if (tab === 'home') renderHome();
    else if (tab === 'months') renderMonths();
    else if (tab === 'category') renderCategory();
    else if (tab === 'whole') renderWhole();
    else {
      var a = document.activeElement;
      if (!(a && a.tagName === 'INPUT' && $('#v-settings').contains(a))) renderSettings();
    }
    applyLang();
  }

  /* ---------- actions ---------- */
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function setTab(t) {
    if (TABS.indexOf(t) < 0) t = 'home';
    tab = t;
    try { if (location.hash.slice(1) !== t) location.hash = t; } catch (e) {}
    render();
  }
  function num(id) { var v = parseFloat(($('#' + id).value || '').trim()); return isFinite(v) && v > 0 ? v : 0; }

  async function saveSettings() {
    var err = $('#s-err'); err.hidden = true;
    var sp = parseInt($('#s-spct').value, 10), bp = parseInt($('#s-bpct').value, 10);
    if (!(sp >= 1 && sp <= 100) || !(bp >= 1 && bp <= 100)) { err.textContent = 'Alert levels must be between 1 and 100.'; err.hidden = false; return; }
    var budgets = {};
    CATS.forEach(function (c) { var v = num('s-b-' + c.id); if (v) budgets[c.id] = v; });
    var data = { salary: num('s-salary'), dps: num('s-dps'), salaryPct: sp, budgetPct: bp, budgets: budgets };
    if (S.mode === 'pending') { toast('Still loading your saved data. Try again in a moment.'); return; }
    try { await store.setMonth(curMonth, data); toast('Settings saved'); setTab('home'); }
    catch (e) { err.textContent = 'Could not save. Check your connection and try again.'; err.hidden = false; }
  }

  async function saveFile(name, text) {
    try {
      var d = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (d) { await d.save({ filename: name, data: text }); return; }
    } catch (e) { if (e && e.code === 'declined') return; }
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast('Download is not available here.'); }
  }
  function exportJSON() {
    saveFile('hisab-book-backup-' + todayISO + '.json', JSON.stringify({ app: 'hisab-book', v: 1, months: S.months, exps: S.exps.map(function (e) { var o = Object.assign({}, e); return o; }) }, null, 1));
  }
  function exportCSV() {
    function q(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var rows = S.exps.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    var out = ['Date,Category,Type,Amount,Note'].concat(rows.map(function (e) {
      return [e.date, catName(e.cat), e.sub || '', e.amount, e.note || ''].map(q).join(',');
    }));
    saveFile('hisab-book-expenses-' + todayISO + '.csv', out.join('\n'));
  }
  async function importFile(file) {
    var msg = $('#bk-msg');
    if (S.mode === 'pending') { msg.textContent = 'Still loading your saved data. Try again in a moment.'; return; }
    try {
      var data = JSON.parse(await file.text());
      var ms = data.months || {}, es = Array.isArray(data.exps) ? data.exps : [];
      function sig(e) { return [e.date, e.cat, e.sub || '', Number(e.amount), e.note || '', e.ts || ''].join('|'); }
      var have = {}; S.exps.forEach(function (e) { have[sig(e)] = 1; });
      var added = 0, mk = Object.keys(ms);
      msg.textContent = 'Importing...';
      for (var i = 0; i < mk.length; i++) if (/^\d{4}-\d{2}$/.test(mk[i]) && !S.months[mk[i]]) await store.setMonth(mk[i], ms[mk[i]]);
      for (var j = 0; j < es.length; j++) {
        var e = es[j];
        if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(e.date || '') || !(Number(e.amount) > 0) || have[sig(e)]) continue;
        have[sig(e)] = 1;
        await store.addExp({ date: e.date, month: e.date.slice(0, 7), cat: e.cat || 'other', sub: e.sub || '', amount: Number(e.amount), note: String(e.note || '').slice(0, 120), ts: e.ts || Date.now() });
        added++;
      }
      msg.textContent = 'Done. ' + added + ' expenses added; duplicates were skipped.';
    } catch (err) { msg.textContent = 'That file could not be read as a Hisab Book backup.'; }
  }

  function fillCats() {
    $('#f-cat').innerHTML = CATS.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('');
    $('#f-sub').innerHTML = CATS[0].subs.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('');
  }
  function syncSub() { $('#f-sub-wrap').hidden = $('#f-cat').value !== 'house'; }
  function openSheet(id) {
    if (S.mode === 'pending') { toast('Still loading your saved data. Try again in a moment.'); return; }
    editing = id || null; delArmed = false;
    var e = null;
    if (id) e = S.exps.filter(function (x) { return x.id === id; })[0] || null;
    if (id && !e) return;
    $('#sheet-title').textContent = e ? 'Edit expense' : 'Add expense';
    $('#f-amount').value = e ? e.amount : '';
    $('#f-cat').value = e && catName(e.cat) && CATS.some(function (c) { return c.id === e.cat; }) ? e.cat : 'grocery';
    $('#f-sub').value = e && e.sub ? e.sub : CATS[0].subs[0];
    $('#f-date').value = e ? e.date : (todayISO.slice(0, 7) === curMonth ? todayISO : curMonth + '-01');
    $('#f-note').value = e ? (e.note || '') : '';
    $('#f-err').hidden = true;
    $('#f-del').hidden = !e; $('#f-del').textContent = 'Delete';
    syncSub();
    $('#scrim').hidden = false; $('#sheet').hidden = false;
    setTimeout(function () { $('#f-amount').focus(); }, 30);
  }
  function closeSheet() { $('#scrim').hidden = true; $('#sheet').hidden = true; editing = null; delArmed = false; }

  async function submitExpense(ev) {
    ev.preventDefault();
    var err = $('#f-err'); err.hidden = true;
    var amount = parseFloat($('#f-amount').value);
    var date = $('#f-date').value;
    var cat = $('#f-cat').value;
    if (!(amount > 0)) { err.textContent = 'Enter an amount greater than zero.'; err.hidden = false; return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date.slice(0, 7) < MIN_MONTH) { err.textContent = 'Pick a date from January 2024 onward.'; err.hidden = false; return; }
    var obj = { date: date, month: date.slice(0, 7), cat: cat, sub: cat === 'house' ? $('#f-sub').value : '', amount: Math.round(amount * 100) / 100, note: $('#f-note').value.trim().slice(0, 120), ts: Date.now() };
    var btn = $('#f-save'); btn.disabled = true;
    try {
      if (editing) await store.setExp(editing, obj); else await store.addExp(obj);
      closeSheet();
      if (obj.month !== curMonth) curMonth = obj.month;
      toast(editing ? 'Expense updated' : 'Expense added');
      render();
    } catch (e) { err.textContent = 'Could not save. Check your connection and try again.'; err.hidden = false; }
    btn.disabled = false;
  }
  async function deleteExpense() {
    if (!editing) return;
    if (!delArmed) { delArmed = true; $('#f-del').textContent = 'Tap again to delete'; return; }
    try { await store.delExp(editing); closeSheet(); toast('Expense deleted'); render(); }
    catch (e) { var err = $('#f-err'); err.textContent = 'Could not delete. Try again.'; err.hidden = false; }
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'tab') { setTab(t.getAttribute('data-tab')); window.scrollTo(0, 0); }
    else if (a === 'pick-month') { renderMonths._d = 0; curMonth = t.getAttribute('data-m'); setTab('home'); window.scrollTo(0, 0); }
    else if (a === 'theme') setTheme(t.getAttribute('data-theme-set'));
    else if (a === 'add') openSheet(null);
    else if (a === 'edit') openSheet(t.getAttribute('data-id'));
    else if (a === 'close') closeSheet();
    else if (a === 'delete') deleteExpense();
    else if (a === 'save-settings') saveSettings();
    else if (a === 'export-json') exportJSON();
    else if (a === 'export-csv') exportCSV();
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'lang') { LANG = t.getAttribute('data-l'); try { localStorage.setItem('hisab-lang', LANG); } catch (e) {} render(); }
    else if (a === 'rec-del') { var id = t.getAttribute('data-id'); S.rec = S.rec.filter(function (r) { return r.id !== id; }); S.del[id] = Date.now(); persistLocal(); render(); }
    else if (a === 'rec-add') {
      var amt = parseFloat($('#r-amt').value), day = parseInt($('#r-day').value, 10), cat = $('#r-cat').value;
      if (!(amt > 0) || !(day >= 1 && day <= 31)) { $('#r-err').textContent = 'Enter an amount and a day between 1 and 31.'; return; }
      var n = new Date();
      S.rec.push({ id: localId(), cat: cat, sub: cat === 'house' ? $('#r-sub').value : '', amount: Math.round(amt * 100) / 100, day: day, note: $('#r-note').value.trim().slice(0, 60), from: n.getFullYear() + '-' + pad(n.getMonth() + 1), ut: Date.now() });
      applyRecurring(); persistLocal(); toast('Recurring expense added'); render();
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id !== 'q') return;
    q = ev.target.value; render();
    var el = $('#q'); if (el) { el.focus(); el.setSelectionRange(q.length, q.length); }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'filter') { filterCat = ev.target.value; render(); }
    if (ev.target.id === 'f-cat') syncSub();
    if (ev.target.id === 'imp-file' && ev.target.files[0]) importFile(ev.target.files[0]);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (!$('#sheet').hidden) closeSheet();
  });
  $('#sheet').addEventListener('submit', submitExpense);
  window.addEventListener('hashchange', function () {
    var t = location.hash.slice(1);
    if (t && t !== tab && TABS.indexOf(t) >= 0) { tab = t; render(); }
  });
  var rz;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { if (tab === 'whole') { var m = summarize(curMonth); renderChart(m, m.st); } }, 150);
  });

  /* ---------- menu and theme ---------- */
  var THEME_KEY = 'hisab-theme';
  function effectiveTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function syncTheme() {
    var cur = effectiveTheme();
    document.querySelectorAll('[data-theme-set]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-theme-set') === cur ? 'true' : 'false');
    });
  }
  function setTheme(t) {
    if (t !== 'dark' && t !== 'light') return;
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    syncTheme();
  }
  try {
    var savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (e) {}
  syncTheme();
  if (window.matchMedia) {
    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme); } catch (e) {}
  }


  /* ---------- login gate ---------- */
  var AUTH = { salt: '567cb1ce2b6c491facd5a050c253a864', iter: 200000, hash: 'd279293efaa2334211f3b4bd514a05954aa8872c4581e03c509a8759f51b1df8' };
  function hexOf(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  async function authHash(id, pw) {
    var enc = new TextEncoder();
    var key = await crypto.subtle.importKey('raw', enc.encode(id + ':' + pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(AUTH.salt), iterations: AUTH.iter }, key, 256);
    return hexOf(bits);
  }
  function gmsg(t) { $('#gate-msg').textContent = t || ''; }
  function showLogin() {
    $('#gate').hidden = false; $('#gate').style.display = 'flex';
    $('#gate-login').hidden = false; $('#gate-google').hidden = true;
    $('#gate-sub').textContent = 'Log in to continue'; $('#g-pw').value = ''; gmsg('');
  }
  function hideGate() { $('#gate').hidden = true; $('#gate').style.display = 'none'; }
  async function toGoogle(silentOnly) {
    $('#gate-login').hidden = true; $('#gate-google').hidden = false;
    $('#gate-sub').textContent = 'Now sign in with Google to load your data'; gmsg('');
    try { if (localStorage.getItem(DRIVE_FLAG)) { gmsg('Connecting...'); await driveSync(false); } } catch (e) {}
    if (D.ok) { hideGate(); render(); } else { gmsg(silentOnly ? '' : 'Tap the button to sign in.'); }
  }
  $('#gate-login').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var id = $('#g-id').value.replace(/\s+/g, '').toLowerCase(), pw = $('#g-pw').value;
    gmsg('Checking...');
    try {
      var ok = (await authHash(id, pw)) === AUTH.hash;
      if (!ok) { gmsg('Wrong ID or password.'); $('#g-pw').value = ''; return; }
    } catch (e) { gmsg('Login needs a secure (https) connection.'); return; }
    try { sessionStorage.setItem('hisab-auth', '1'); } catch (e) {}
    toGoogle(false);
  });
  $('#g-google').addEventListener('click', async function () {
    gmsg('Signing in...'); await driveSync(true);
    if (D.ok) { hideGate(); render(); } else gmsg('Sign in failed. Try again.');
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act="signout"]'); if (!t) return;
    try { sessionStorage.removeItem('hisab-auth'); localStorage.removeItem(DRIVE_FLAG); } catch (e) {}
    D.on = false; D.ok = false; D.token = null; D.fileId = null;
    D.msg = 'Signed out.'; showLogin();
  });
  var authed = false; try { authed = sessionStorage.getItem('hisab-auth') === '1'; } catch (e) {}
  if (authed) { showLogin(); $('#gate-login').hidden = true; toGoogle(true); } else showLogin();

  fillCats();
  var h = (location.hash || '').slice(1);
  if (h === 'dashboard') h = 'home';
  if (TABS.indexOf(h) >= 0) tab = h;
  render();
  initStore();
})();
</script>

</body></html>
